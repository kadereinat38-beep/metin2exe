name: EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: Expand-Archive -Path Metin2Exe.zip -DestinationPath .
      - run: npm install
        working-directory: Metin2Exe
      - run: npx electron-builder --win portable --publish never
        working-directory: Metin2Exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Metin2Hesap-exe
          path: Metin2Exe/dist/Metin2Hesap.exe
